name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
      - run: go vet ./...
      - run: go test -race ./...
      - name: Self-update, end to end
        run: go test -count=1 -run TestSelfUpdateE2E ./internal/selfupdate
        env:
          SELFUPDATE_E2E: '1'
        shell: bash
