name: Native regression checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
            python: .venv-workers/bin/python
          - runner: windows-2022
            platform: win32-x64
            python: .venv-workers/Scripts/python.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.0'
          architecture: x64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
          architecture: x64
      - name: Confirm native target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: node -e "if (process.platform + '-' + process.arch !== process.env.EXPECTED_PLATFORM) process.exit(1); console.log(process.platform, process.arch, process.version)"
      - name: Install build-only dependencies
        run: |
          python -m venv .venv-workers
          "${{ matrix.python }}" -m pip install -r workers/requirements.txt -r tests/requirements.txt
          npm ci
          mkdir -p out
      - name: Compare native filesystem identities
        env:
          WORKER_PYTHON: ${{ matrix.python }}
        run: |
          node --input-type=module <<'JS'
          import { mkdtemp, lstat, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const root = await mkdtemp(join(tmpdir(), 'volume-identity-'));
          try {
            const info = await lstat(root, { bigint: true });
            const result = spawnSync(resolve(process.env.WORKER_PYTHON), ['-c', 'import os,sys,json; s=os.lstat(sys.argv[1]); print(json.dumps({"device":str(s.st_dev),"inode":str(s.st_ino)}))', root], { encoding: 'utf8' });
            if (result.status !== 0) throw new Error('Python identity check failed');
            console.log(JSON.stringify({ node: { device: String(info.dev), inode: String(info.ino) }, python: JSON.parse(result.stdout) }));
          } finally { await rm(root, { recursive: true }); }
          JS
      - name: App regression tests
        run: npm test -- --reporter=default --reporter=json --outputFile=out/native-tests.json
      - name: Python preparation tests
        if: ${{ !cancelled() }}
        run: '"${{ matrix.python }}" -m unittest discover -s tests/preparation -p "test_*.py" -v'
      - name: Python volume tests
        if: ${{ !cancelled() }}
        run: '"${{ matrix.python }}" -m unittest discover -s tests/devices -p "test_*.py" -v'
      - name: Typecheck and compile app sources
        if: ${{ !cancelled() }}
        run: |
          npm run typecheck
          npm run build
          node scripts/verify-worker.mjs
      - name: Build native Python workers
        run: node scripts/build-python-workers.mjs
      - name: Exercise packaged workers without system Python
        run: |
          export VITA_TEST_WORKER="$(node -e "console.log(require('node:path').resolve('out/native-python-workers',process.platform+'-'+process.arch,'vita-prepare'+(process.platform==='win32'?'.exe':'')))")"
          export VITA_TEST_VOLUME_WORKER="$(node -e "console.log(require('node:path').resolve('out/native-python-workers',process.platform+'-'+process.arch,'vita-volume/vita-volume'+(process.platform==='win32'?'.exe':'')))")"
          "${{ matrix.python }}" -m unittest discover -s tests/preparation -p 'test_*.py' -v
          "${{ matrix.python }}" -m unittest discover -s tests/devices -p 'test_*.py' -v
          npm test -- tests/devices/transports.test.ts tests/jobs/integration.test.ts --reporter=default --reporter=json --outputFile=out/packaged-worker-tests.json
      - name: Retain test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-tests-${{ matrix.platform }}
          path: |
            out/native-tests.json
            out/packaged-worker-tests.json
          if-no-files-found: ignore
          retention-days: 3
