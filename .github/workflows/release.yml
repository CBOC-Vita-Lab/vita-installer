name: Release

# Publishes a release whenever CHANGELOG.md starts with a version that has no
# release yet: bump the top "## x.y.z" heading, push to main, done. Every
# download is built on macOS (so the Mac app is properly signed), and that
# version's CHANGELOG section becomes the release notes. Old draft releases
# from earlier versions are removed.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: macos-15-intel  # arm64 macOS runners are often out of capacity
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the version
        id: version
        run: |
          version="$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## *//')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.version.outputs.new == 'true'
        with:
          go-version: '1.20.14'
      - if: steps.version.outputs.new == 'true'
        run: go test ./...
      - if: steps.version.outputs.new == 'true'
        run: go install github.com/tc-hib/go-winres@v0.3.3
      - if: steps.version.outputs.new == 'true'
        run: GOTOOLCHAIN=local scripts/build.sh "${{ steps.version.outputs.version }}"
      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          gh release create "v$version" dist/* --target "$GITHUB_SHA" \
            --title "CBOC Vita Installer $version" --notes-file notes.md --latest
      - name: Remove old draft releases
        if: steps.version.outputs.new == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' |
          while read -r tag; do
            base="${tag#v}"; base="${base%%-*}"
            older="$(printf '%s\n%s\n' "$base" "$version" | sort -V | head -1)"
            if [ "$base" != "$version" ] && [ "$older" = "$base" ]; then
              gh release delete "$tag" --yes && echo "deleted draft $tag"
            fi
          done
