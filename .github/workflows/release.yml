name: Release

# Builds every download on macOS (so the Mac app is properly signed) and
# attaches them to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
      - run: go test ./...
      - run: go install github.com/tc-hib/go-winres@v0.3.3
      - run: GOTOOLCHAIN=local scripts/build.sh "${TAG#v}"
      - run: gh release upload "$TAG" dist/* --clobber
